<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlantGuard · Campo</title>
<style>
  :root { --bg:#f6f8fa; --bg2:#fff; --bg3:#eef1f4; --fg:#111; --fg2:#4a5560; --fg3:#7a8691; --border:#d6dbe0; --green:#2ea043; --red:#d1242f; --amber:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --bg2:#161b22; --bg3:#1f262e; --fg:#e6edf3; --fg2:#a9b4bf; --fg3:#7d8590; --border:#30363d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:40px; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  header .who { flex:1; min-width:0; }
  header .who b { display:block; font-size:15px; }
  header .who span { font-size:12px; color:var(--fg2); }
  .btn { display:inline-block; padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg3); color:var(--fg); font-size:14px; cursor:pointer; text-align:center; }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .btn-green { background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  #mic { display:block; width:100%; padding:26px 16px; font-size:20px; font-weight:700; border:none; border-radius:18px; color:#fff; cursor:pointer;
    background:radial-gradient(circle at 30% 30%,#5be08a,#1f7a3d); box-shadow:0 6px 20px rgba(46,160,67,.35); }
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:14px; margin-top:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .task { display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--border); }
  .task:first-of-type { border-top:none; }
  .task .t { flex:1; min-width:0; overflow-wrap:anywhere; }
  .task .t small { display:block; color:var(--fg3); }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--bg3); color:var(--fg2); }
  .pill.urg { background:var(--red); color:#fff; }
  label { display:block; font-size:12px; color:var(--fg2); margin:10px 0 4px; }
  select, input[type=text], textarea { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .msg { font-size:13px; margin-top:8px; min-height:18px; }
  .ok { color:var(--green); } .err { color:var(--red); }
  .empty { color:var(--fg3); font-size:13px; }
  #ga-hint, #ga-state { color:var(--fg2); }
</style>
</head>
<body>
<header>
  <div class="who"><b id="who-name">Cargando…</b><span id="who-role"></span></div>
  <span class="btn btn-sm" id="logout">Salir</span>
</header>
<main>
  <button id="mic">🎙️ Hablar con el Grow Agent</button>

  <div class="card">
    <h2>📋 Mis tareas</h2>
    <div id="tasks"><div class="empty">Cargando…</div></div>
  </div>

  <div class="card">
    <h2>⚠️ Comunicar una incidencia</h2>
    <label>Tipo</label>
    <select id="inc-kind">
      <option value="infra">Infraestructura (gotera, avería, riego, luces, clima…)</option>
      <option value="cultivo">Cultivo (planta rota, plaga, enfermedad…)</option>
    </select>
    <label>Zona</label>
    <select id="inc-zone"><option value="">— sin indicar —</option></select>
    <label>Gravedad</label>
    <select id="inc-sev"><option>Media</option><option>Alta</option><option>Urgente</option><option>Baja</option></select>
    <label>Qué ha pasado</label>
    <textarea id="inc-desc" placeholder="Describa brevemente lo que ve"></textarea>
    <div style="margin-top:12px"><span class="btn btn-green" id="inc-send">Enviar incidencia</span></div>
    <div class="msg" id="inc-msg"></div>
  </div>

  <div class="card">
    <h2>📷 Enviar una foto</h2>
    <input type="file" id="ph-file" accept="image/*" style="display:none">
    <span class="btn" id="ph-pick">Cámara o galería</span>
    <img id="ph-prev" style="display:none;max-width:100%;border-radius:10px;margin-top:10px" alt="">
    <label>Zona</label>
    <select id="ph-zone"><option value="">— sin indicar —</option></select>
    <label>Nota</label>
    <input type="text" id="ph-note" placeholder="Qué se ve, síntomas">
    <div style="margin-top:12px"><span class="btn btn-green" id="ph-send">Subir foto</span></div>
    <div class="msg" id="ph-msg"></div>
  </div>
</main>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ME = null, DATA = {};

async function api(method, body) {
  const r = await fetch('/api/ops-data', { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data: d };
}

async function loadOpsData() {
  const r = await api('GET');
  if (r.status === 401) { location.href = '/'; return; }
  if (!r.ok) return;
  DATA = r.data;
  renderTasks();
  const zones = (DATA.zonas || []).map(z => `<option>${esc(z.Nombre)}</option>`).join('');
  ['inc-zone', 'ph-zone'].forEach(id => {
    const el = document.getElementById(id), keep = el.value;
    el.innerHTML = '<option value="">— sin indicar —</option>' + zones; el.value = keep;
  });
}
window.loadOpsData = loadOpsData;

function renderTasks() {
  const mine = (DATA.tareas || []).filter(t => ME && String(t.Tecnico || '').trim().toLowerCase() === ME.name.trim().toLowerCase() && t.Estado !== 'Hecho');
  const box = document.getElementById('tasks');
  box.innerHTML = mine.length ? mine.map(t => `<div class="task"><div class="t">${esc(t.Tarea)}<small>${esc([t.Zona && 'Zona ' + t.Zona, t.Fecha].filter(Boolean).join(' · '))}</small></div>
      <span class="pill${t.Prioridad === 'Urgente' ? ' urg' : ''}">${esc(t.Prioridad || 'Normal')}</span>
      ${t.Estado === 'En curso' ? '' : `<span class="btn btn-sm" data-start="${esc(t._id)}">Empezar</span>`}
      <span class="btn btn-sm btn-green" data-done="${esc(t._id)}">Hecho</span></div>`).join('')
    : '<div class="empty">No tiene tareas pendientes. Si necesita algo, hable con el Grow Agent.</div>';
  box.querySelectorAll('[data-start]').forEach(b => b.onclick = () => setTask(b.dataset.start, 'En curso'));
  box.querySelectorAll('[data-done]').forEach(b => b.onclick = () => setTask(b.dataset.done, 'Hecho'));
}

async function setTask(id, estado) {
  await api('PATCH', { table: 'tareas', id, fields: { Estado: estado } });
  loadOpsData();
}

document.getElementById('inc-send').onclick = async () => {
  const msg = document.getElementById('inc-msg'), desc = document.getElementById('inc-desc').value.trim();
  if (!desc) { msg.className = 'msg err'; msg.textContent = 'Describa qué ha pasado.'; return; }
  const kind = document.getElementById('inc-kind').value, zone = document.getElementById('inc-zone').value || null;
  const sev = document.getElementById('inc-sev').value, who = ME ? ME.name : '';
  const body = kind === 'cultivo'
    ? { table: 'alertas_ipm', fields: { Zona: zone || 'Sin indicar', Plaga: desc, Severidad: sev, Estado: 'Abierta', Creada: new Date().toISOString(), Protocolo: 'Reportada por ' + who } }
    : { table: 'tareas', fields: { Tarea: desc, Zona: zone, Prioridad: sev === 'Baja' ? 'Normal' : (sev === 'Media' ? 'Normal' : sev), Estado: 'Pendiente', Fecha: new Date().toISOString().slice(0, 10), Notas: 'Incidencia reportada por ' + who + ' desde campo' } };
  msg.className = 'msg'; msg.textContent = 'Enviando…';
  const r = await api('POST', body);
  if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'Incidencia enviada. El administrador la verá enseguida.'; document.getElementById('inc-desc').value = ''; }
  else { msg.className = 'msg err'; msg.textContent = 'No se pudo enviar (' + (r.data.error || r.status) + ').'; }
};

// ---- photo: resize on the device so it always fits the upload limit ----
let photoB64 = null, photoName = 'foto.jpg';
document.getElementById('ph-pick').onclick = () => document.getElementById('ph-file').click();
document.getElementById('ph-file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  photoName = (f.name || 'foto.jpg').replace(/[^A-Za-z0-9._-]/g, '_');
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.82);
    photoB64 = data.split(',')[1]; photoName = photoName.replace(/\.[^.]+$/, '') + '.jpg';
    const p = document.getElementById('ph-prev'); p.src = data; p.style.display = 'block';
    URL.revokeObjectURL(url);
  };
  img.src = url;
};
document.getElementById('ph-send').onclick = async () => {
  const msg = document.getElementById('ph-msg');
  if (!photoB64) { msg.className = 'msg err'; msg.textContent = 'Elija primero una foto.'; return; }
  msg.className = 'msg'; msg.textContent = 'Subiendo…';
  const r = await fetch('/api/gm-upload-photo', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image_base64: photoB64, filename: photoName, zone: document.getElementById('ph-zone').value, note: document.getElementById('ph-note').value }) });
  if (r.ok) { msg.className = 'msg ok'; msg.textContent = 'Foto enviada y archivada.'; photoB64 = null; document.getElementById('ph-prev').style.display = 'none'; document.getElementById('ph-note').value = ''; }
  else { msg.className = 'msg err'; msg.textContent = 'No se pudo subir la foto.'; }
};

document.getElementById('logout').onclick = async () => { await fetch('/api/access', { method: 'DELETE' }); location.href = '/'; };

(async () => {
  const r = await fetch('/api/ops-data?me=1').then(x => x.ok ? x.json() : null).catch(() => null);
  if (!r) { location.href = '/'; return; }
  ME = r;
  document.getElementById('who-name').textContent = r.name || 'Empleado';
  document.getElementById('who-role').textContent = r.role === 'operario' ? 'Operario de cultivo' : (r.role === 'jefe' ? 'Jefe de cultivo' : 'Super administrador');
  await loadOpsData();
})();
document.getElementById('mic').onclick = () => { if (window.openGrowAgent) window.openGrowAgent(); };
</script>
<script src="/grow-agent.js"></script>
</body>
</html>
