<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantGuard Pro Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #333;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      font-family: monospace;
      letter-spacing: 2px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .error {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 PlantGuard Pro</h1>
    <p class="subtitle">Admin Panel</p>
    
    <form id="loginForm" onsubmit="login(event)">
      <div class="form-group">
        <label for="pin">PIN de Administrador</label>
        <input 
          type="password" 
          id="pin" 
          placeholder="••••••••" 
          maxlength="8"
          autocomplete="off"
          required
        >
      </div>
      <button type="submit">Entrar</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    const CORRECT_PIN = "12345678";
    const SESSION_DURATION = 30 * 60 * 1000;

    function login(event) {
      event.preventDefault();
      const pin = document.getElementById("pin").value;
      const errorDiv = document.getElementById("error");

      if (pin === CORRECT_PIN) {
        const sessionData = {
          token: btoa(CORRECT_PIN + Date.now()),
          timestamp: Date.now()
        };
        localStorage.setItem("pg_admin_session", JSON.stringify(sessionData));
        window.location.href = "/index.html";
      } else {
        errorDiv.textContent = "PIN incorrecto. Intenta de nuevo.";
        errorDiv.classList.add("show");
        document.getElementById("pin").value = "";
        document.getElementById("pin").focus();
      }
    }

    window.addEventListener("load", () => {
      const sessionData = localStorage.getItem("pg_admin_session");
      if (sessionData) {
        try {
          const data = JSON.parse(sessionData);
          const elapsed = Date.now() - data.timestamp;
          if (elapsed < SESSION_DURATION) {
            window.location.href = "/index.html";
          } else {
            localStorage.removeItem("pg_admin_session");
          }
        } catch (e) {
          localStorage.removeItem("pg_admin_session");
        }
      }
      document.getElementById("pin").focus();
    });
  </script>
</body>
</html>
